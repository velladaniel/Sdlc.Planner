name: Publish to NuGet

# Publishes when a version tag is pushed (e.g. v1.0.1) or when run manually.
# Uses NuGet trusted publishing (OIDC): no long-lived API key is stored.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # required for the OIDC token exchange with nuget.org

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Resolve version
        id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "value=$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' Sdlc.Planner.csproj | head -1)" >> "$GITHUB_OUTPUT"
          fi

      - name: Pack
        run: dotnet pack Sdlc.Planner.csproj -c Release -o artifacts -p:Version=${{ steps.version.outputs.value }}

      - name: NuGet login (trusted publishing)
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }} # your nuget.org profile name (not email)

      - name: Push
        run: dotnet nuget push "artifacts/*.nupkg" --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate
